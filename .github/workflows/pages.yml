name: Publish TraceFact
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/cache@v4
        with:
          path: |
            .cache/models
            benchmark-cache
          key: minilm-cfever-v2-2c4055b12046f11709e9df2c122e59ffbdc2f900
      - run: node scripts/build-retrieval.mjs
      - run: node scripts/update-feed.mjs
      - run: node scripts/build-semantic.mjs
      - run: node --test
      - run: node scripts/evaluate.mjs
      - run: node scripts/benchmark.mjs
      - run: node scripts/sentence-benchmark.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: github-pages-${{ github.run_attempt }}
      - name: Wait for artifact metadata
        run: node scripts/wait-artifact.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
      - uses: actions/deploy-pages@v4
        id: deploy
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
